<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Startup Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-white p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Top Header & Banner -->
    <div class="flex justify-between items-center bg-slate-800 p-6 rounded-xl border border-slate-700">
      <div>
        <h1 id="startupName" class="text-3xl font-extrabold text-indigo-400">Loading...</h1>
        <p id="startupCategory" class="text-sm text-slate-400"></p>
      </div>
      <div id="shockBanner" class="bg-emerald-900/50 border border-emerald-500 text-emerald-300 px-4 py-2 rounded-lg text-sm font-semibold">
        Market Condition: Normal ⚖️
      </div>
    </div>

    <!-- Metrics Grid -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-slate-400 text-xs uppercase font-bold">Capital / Budget</p>
        <p id="budget" class="text-2xl font-bold text-green-400">$0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-slate-400 text-xs uppercase font-bold">Total Revenue</p>
        <p id="revenue" class="text-2xl font-bold text-indigo-400">$0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-slate-400 text-xs uppercase font-bold">Units Sold (Last Cycle)</p>
        <p id="lastSales" class="text-2xl font-bold text-yellow-400">0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-slate-400 text-xs uppercase font-bold">Est. Conversion Rate</p>
        <p id="conversion" class="text-2xl font-bold text-pink-400">0%</p>
      </div>
    </div>

    <!-- Product Controls -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
      <h2 class="text-xl font-bold">Manage Product Strategy</h2>
      <div class="flex items-center space-x-4">
        <div class="flex-1">
          <label class="block text-sm text-slate-400 mb-1">Set Product Price ($ / Unit)</label>
          <input type="number" id="priceInput" class="w-full bg-slate-700 p-2 rounded border border-slate-600 focus:outline-none">
        </div>
        <button id="updatePriceBtn" class="mt-6 bg-indigo-600 hover:bg-indigo-500 font-bold px-6 py-2 rounded">Update Strategy</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const info = JSON.parse(sessionStorage.getItem('startup_info'));

    if (!info) window.location.href = '/';

    socket.emit('register_startup', info);

    socket.on('cycle_tick', (data) => {
      const { startup, activeShock } = data;
      document.getElementById('startupName').innerText = startup.name;
      document.getElementById('startupCategory').innerText = `Category: ${startup.category}`;
      document.getElementById('budget').innerText = `$${startup.budget.toFixed(2)}`;
      document.getElementById('revenue').innerText = `$${startup.revenue.toFixed(2)}`;
      document.getElementById('lastSales').innerText = startup.lastTurnSales;
      document.getElementById('conversion').innerText = `${startup.lastTurnConversion}%`;

      if (activeShock) {
        document.getElementById('shockBanner').innerText = `Active Shock: ${activeShock.name} - ${activeShock.description}`;
      }
    });

    document.getElementById('updatePriceBtn').addEventListener('click', () => {
      const newPrice = document.getElementById('priceInput').value;
      socket.emit('update_product', { unitPrice: newPrice });
      alert('Strategy Updated!');
    });
  </script>
</body>
</html>
