<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MarketShock - Startup Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">
  <div class="bg-slate-800 p-8 rounded-xl shadow-2xl max-w-md w-full border border-slate-700">
    <h1 class="text-3xl font-bold text-indigo-400 mb-2">MarketShock ⚡</h1>
    <p class="text-slate-400 mb-6">Test your startup against real-time market turbulence.</p>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Startup Name</label>
        <input type="text" id="name" required class="w-full bg-slate-700 rounded p-2 border border-slate-600 focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Category</label>
        <select id="category" class="w-full bg-slate-700 rounded p-2 border border-slate-600 focus:outline-none focus:border-indigo-500">
          <option value="Tech">SaaS / Deep Tech</option>
          <option value="Consumer">Consumer Goods / E-Commerce</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Initial Product Unit Price ($)</label>
        <input type="number" id="unitPrice" value="50" min="1" required class="w-full bg-slate-700 rounded p-2 border border-slate-600 focus:outline-none focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2 rounded transition">Launch Venture 🚀</button>
    </form>
    <div class="mt-4 text-center">
      <a href="/admin.html" class="text-xs text-slate-500 hover:underline">Go to Judges / Admin Portal →</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const category = document.getElementById('category').value;
      const unitPrice = document.getElementById('unitPrice').value;

      sessionStorage.setItem('startup_info', JSON.stringify({ name, category, unitPrice }));
      window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
